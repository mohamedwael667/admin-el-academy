<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المحاضرات | Admin El Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050b1e;--line:rgba(255,255,255,.09);--sky:#38bdf8;--gold:#facc15;--text:#eef2ff;--muted:#9fb0ce;--grad:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#38bdf8)}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
.container{max-width:1150px;margin:auto;padding:0 20px}
.blob{position:fixed;border-radius:50%;filter:blur(95px);opacity:.35;z-index:0}
.blob-1{width:520px;height:520px;background:radial-gradient(circle,#1d4ed8,transparent 65%);top:-140px;right:-120px}
.blob-2{width:460px;height:460px;background:radial-gradient(circle,#0e7490,transparent 65%);bottom:-120px;left:-100px}
.top{position:sticky;top:0;z-index:10;background:rgba(5,11,30,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-wrap{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800}
.logo img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4)}
.logo b{background:linear-gradient(90deg,#93c5fd,#fde047);-webkit-background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;transition:.3s;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text)}
.btn.danger{color:#fca5a5;border-color:rgba(239,68,68,.35);background:none}
main{position:relative;z-index:1;padding:40px 0 70px}
.page-head{text-align:center;margin-bottom:28px}
.page-head h1{font-size:clamp(24px,4vw,38px);font-weight:900}
.page-head h1 i{color:var(--gold)}
.page-head p{color:var(--muted);margin-top:8px}
.filters{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:26px}
.filters select{padding:11px 18px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14px;font-weight:800;outline:none;cursor:pointer}
.filters select option{background:#081231}
.count{text-align:center;color:var(--muted);font-size:13px;font-weight:800;margin-bottom:18px}
.count b{color:var(--gold)}
.lecs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.lec{border-radius:20px;overflow:hidden;background:rgba(8,18,49,.6);border:1px solid var(--line);transition:.35s;cursor:pointer}
.lec:hover{transform:translateY(-8px);border-color:rgba(56,189,248,.45);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#081231}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.5s}
.lec:hover .thumb img{transform:scale(1.08)}
.play{position:absolute;inset:0;display:grid;place-items:center}
.play i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(5,11,30,.75);color:#fff;font-size:20px;backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.7);transition:.3s}
.lec:hover .play i{transform:scale(1.12);background:var(--grad);border-color:transparent}
.dur{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.75);padding:3px 10px;border-radius:8px;font-size:11px;font-weight:800}
.lec-body{padding:16px}
.tag{display:inline-block;font-size:11px;font-weight:800;color:var(--gold);background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.35);padding:3px 12px;border-radius:50px;margin-bottom:8px}
.lec-body h3{font-size:15.5px;font-weight:800;margin-bottom:8px;line-height:1.6;min-height:48px}
.lec-meta{color:var(--muted);font-size:12.5px;font-weight:700;display:flex;gap:12px;flex-wrap:wrap}
.lec-meta i{color:var(--sky);margin-left:4px}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-weight:800}
.empty i{font-size:50px;color:var(--sky);display:block;margin-bottom:14px}
.empty p{font-size:16px}
.modal{position:fixed;inset:0;background:rgba(2,6,18,.88);backdrop-filter:blur(8px);display:none;place-items:center;z-index:100;padding:20px}
.modal.open{display:grid}
.modal-box{width:min(920px,95vw)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.modal-head h3{font-size:16px;font-weight:800}
.x{background:none;border:1px solid var(--line);color:#fca5a5;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;transition:.3s;flex-shrink:0}
.x:hover{background:rgba(239,68,68,.12)}
.frame{aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6);background:#000}
.frame iframe{width:100%;height:100%;border:0}
@media(max-width:950px){.lecs{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.lecs{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="blob blob-1"></div><div class="blob blob-2"></div>

<header class="top">
  <div class="container top-wrap">
    <a href="index.html" class="logo"><img src="logo.png" alt="" onerror="this.style.display='none'"><span>Admin <b>El Academy</b></span></a>
    <div style="display:flex;gap:10px">
      <a href="dashboard.html" class="btn"><i class="fa-solid fa-gauge-high"></i> لوحتك</a>
      <button id="logoutBtn" class="btn danger"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="page-head">
    <h1>المحاضرات <i class="fa-solid fa-clapperboard"></i></h1>
    <p>كل محاضراتك مرتبة بالفرقة والقسم — دوس على أي محاضرة وشاهدها جوه المنصة</p>
  </section>

  <div class="filters">
    <select id="fYear">
      <option value="">كل الفرق</option><option>الأولى</option><option>الثانية</option><option>الثالثة</option><option>الرابعة</option>
    </select>
    <select id="fDept">
      <option value="">كل الأقسام</option><option>نظم ومعلومات إدارية</option><option>إدارة أعمال</option><option>تسويق</option>
    </select>
  </div>

  <p class="count">عدد المحاضرات المعروضة: <b id="count">0</b></p>
  <div id="content">
    <div class="lecs" id="lecs"></div>
  </div>
  <div class="empty" id="empty" style="display:none">
    <i class="fa-solid fa-video-slash"></i>
    <p id="emptyText">مفيش محاضرات حاليًا — الأدمن هيضيفها قريبًا</p>
  </div>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head"><h3 id="mTitle"></h3><button class="x" id="mClose"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="frame"><iframe id="mFrame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
  auth.onAuthStateChanged(user=>{if(!user)location.href='login.html';});
  $('logoutBtn').onclick=async()=>{localStorage.removeItem('aea_user');await auth.signOut();location.href='index.html';};

  function $(id){return document.getElementById(id)}

  let LECTURES=[];

  async function load(){
    try{
      const snap=await db.collection('lectures').get();
      LECTURES=[];
      snap.forEach(d=>LECTURES.push(d.data()));
      // رتبهم من الأحدث للأقدم
      LECTURES.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    }catch(e){console.warn(e);LECTURES=[];}
    render();
  }

  function render(){
    const y=$('fYear').value,d=$('fDept').value;
    const list=LECTURES.filter(l=>(!y||l.year===y)&&(!d||l.dept===d));
    $('count').textContent=list.length;
    
    if(list.length===0){
      $('content').style.display='none';
      $('empty').style.display='block';
      if(LECTURES.length===0){
        $('emptyText').textContent='مفيش محاضرات حاليًا — الأدمن هيضيفها قريبًا';
      }else{
        $('emptyText').textContent='مفيش محاضرات في الاختيار ده — جرّب فلتر تاني';
      }
      return;
    }
    
    $('content').style.display='block';
    $('empty').style.display='none';
    $('lecs').innerHTML=list.map((l,i)=>`
      <div class="lec" data-i="${LECTURES.indexOf(l)}">
        <div class="thumb">
          <img src="https://i.ytimg.com/vi/${l.yt}/hqdefault.jpg" alt="">
          <span class="play"><i class="fa-solid fa-play"></i></span>
          <span class="dur">${l.dur||'—'}</span>
        </div>
        <div class="lec-body">
          <span class="tag">${l.subject} — الفرقة ${l.year}</span>
          <h3>${l.title}</h3>
          <div class="lec-meta"><span><i class="fa-solid fa-user-doctor"></i>${l.doctor}</span><span><i class="fa-solid fa-layer-group"></i>${l.dept}</span></div>
        </div>
      </div>`).join('');
    document.querySelectorAll('.lec').forEach(c=>c.onclick=()=>{
      const l=LECTURES[c.dataset.i];
      $('mTitle').textContent=l.title+' — '+l.doctor;
      $('mFrame').src='https://www.youtube.com/embed/'+l.yt+'?autoplay=1';
      $('modal').classList.add('open');
    });
  }
  $('fYear').onchange=render;$('fDept').onchange=render;
  $('mClose').onclick=()=>{$('modal').classList.remove('open');$('mFrame').src='';};
  $('modal').onclick=e=>{if(e.target.id==='modal'){$('modal').classList.remove('open');$('mFrame').src='';}};
  load();
</script>
</body>
</html>
