<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجز دكتور | Admin El Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050b1e;--line:rgba(255,255,255,.09);--sky:#38bdf8;--gold:#facc15;--text:#eef2ff;--muted:#9fb0ce;--grad:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#38bdf8)}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
.container{max-width:1100px;margin:auto;padding:0 20px}
.blob{position:fixed;border-radius:50%;filter:blur(95px);opacity:.35;z-index:0}
.blob-1{width:520px;height:520px;background:radial-gradient(circle,#1d4ed8,transparent 65%);top:-140px;right:-120px}
.blob-2{width:460px;height:460px;background:radial-gradient(circle,#0e7490,transparent 65%);bottom:-120px;left:-100px}
.top{position:sticky;top:0;z-index:10;background:rgba(5,11,30,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-wrap{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;gap:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800}
.logo img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.4)}
.logo b{background:linear-gradient(90deg,#93c5fd,#fde047);-webkit-background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;transition:.3s;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text)}
.btn:hover{transform:translateY(-2px)}
.btn.danger{color:#fca5a5;border-color:rgba(239,68,68,.35);background:none}
.btn.danger:hover{background:rgba(239,68,68,.12)}
main{position:relative;z-index:1;padding:40px 0 70px}
.page-head{text-align:center;margin-bottom:34px}
.page-head h1{font-size:clamp(24px,4vw,38px);font-weight:900}
.page-head h1 i{color:var(--gold)}
.page-head p{color:var(--muted);margin-top:8px}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:start}
.card-glass{background:rgba(8,18,49,.6);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:28px}
.card-glass h2{font-size:18px;font-weight:900;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.card-glass h2 i{color:var(--gold)}
.alert{display:none;padding:12px 16px;border-radius:12px;margin-bottom:14px;font-size:14px;font-weight:700}
.alert.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.45);color:#fca5a5}
.alert.success{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.45);color:#86efac}
.field{margin-bottom:14px;text-align:right}
.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px;color:#c9d4ea}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:15px;outline:none;transition:.3s;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.22)}
.field select option{background:#081231}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn.primary{width:100%;justify-content:center;padding:14px;border:none;background:var(--grad);color:#fff;box-shadow:0 10px 30px rgba(37,99,235,.4);font-size:16px}
.spinner{display:none;width:18px;height:18px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.btn.loading .spinner{display:inline-block}
.btn.loading{pointer-events:none;opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
.bookings{display:flex;flex-direction:column;gap:14px}
.book{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:16px;transition:.3s}
.book:hover{border-color:rgba(56,189,248,.4)}
.book-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.book-top b{font-size:15px}
.status{font-size:11px;font-weight:800;padding:4px 12px;border-radius:50px;background:rgba(250,204,21,.12);color:var(--gold);border:1px solid rgba(250,204,21,.4)}
.book-meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:12px}
.book-meta i{color:var(--sky);margin-left:5px}
.cancel{background:none;border:1px solid rgba(239,68,68,.35);color:#fca5a5;border-radius:10px;padding:7px 14px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;transition:.3s}
.cancel:hover{background:rgba(239,68,68,.12)}
.muted{color:var(--muted);font-size:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="blob blob-1"></div><div class="blob blob-2"></div>

<header class="top">
  <div class="container top-wrap">
    <a href="index.html" class="logo"><img src="logo.png" alt="" onerror="this.style.display='none'"><span>Admin <b>El Academy</b></span></a>
    <div style="display:flex;gap:10px">
      <a href="dashboard.html" class="btn"><i class="fa-solid fa-gauge-high"></i> لوحتك</a>
      <button id="logoutBtn" class="btn danger"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="page-head">
    <h1>حجز <i class="fa-solid fa-user-doctor"></i> دكتور</h1>
    <p>اختار الدكتور والموعد المناسب، والحجز هيتسجل باسمك في قاعدة البيانات</p>
  </section>

  <div class="grid">
    <div class="card-glass">
      <h2><i class="fa-solid fa-pen-to-square"></i> بيانات الحجز</h2>
      <div class="alert error" id="errBox"></div>
      <div class="alert success" id="okBox"></div>
      <form id="bookForm" novalidate>
        <div class="field"><label>الدكتور</label>
          <select id="doctor">
            <option>د. أحمد محمود — نظم ومعلومات إدارية</option>
            <option>د. سارة علي — إدارة أعمال</option>
            <option>د. محمد حسن — تسويق</option>
            <option>د. منى خالد — حاسب آلي</option>
          </select>
        </div>
        <div class="row">
          <div class="field"><label>التاريخ</label><input id="date" type="date" required></div>
          <div class="field"><label>الموعد</label>
            <select id="time">
              <option>10:00 ص</option><option>12:00 م</option><option>2:00 م</option><option>4:00 م</option><option>6:00 م</option>
            </select>
          </div>
        </div>
        <div class="field"><label>ملاحظات (اختياري)</label><textarea id="notes" rows="3" placeholder="اكتب أي تفاصيل عايز الدكتور يعرفها..."></textarea></div>
        <button class="btn primary" id="submitBtn" type="submit"><span>تأكيد الحجز <i class="fa-solid fa-calendar-check"></i></span><span class="spinner"></span></button>
      </form>
    </div>

    <div class="card-glass">
      <h2><i class="fa-solid fa-clock-rotate-left"></i> حجوزاتي</h2>
      <div id="myBookings" class="bookings"><p class="muted">ثواني بنحمّل حجوزاتك…</p></div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
  const $=id=>document.getElementById(id);
  let me=null;

  auth.onAuthStateChanged(async user=>{
    if(!user){location.href='login.html';return;}
    me={uid:user.uid,email:user.email};
    let d={};try{d=JSON.parse(localStorage.getItem('aea_user')||'{}')}catch(e){}
    try{const s=await db.collection('profiles').doc(user.uid).get();if(s.exists)Object.assign(d,s.data());}catch(e){}
    me.name=d.name||user.email.split('@')[0];
    $('date').min=new Date().toISOString().split('T')[0];
    loadBookings();
  });

  async function loadBookings(){
    const box=$('myBookings');
    try{
      const snap=await db.collection('bookings').where('user_id','==',me.uid).get();
      if(snap.empty){box.innerHTML='<p class="muted">لسه مفيش حجوزات — احجز أول مرة من الفورم 👆</p>';return;}
      let html='';
      snap.forEach(doc=>{
        const b=doc.data();
        const niceDate=new Date(b.date).toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
        html+='<div class="book"><div class="book-top"><b>'+b.doctor+'</b><span class="status">قيد المراجعة</span></div>'+
          '<div class="book-meta"><span><i class="fa-solid fa-calendar-day"></i> '+niceDate+'</span><span><i class="fa-solid fa-clock"></i> '+b.time+'</span></div>'+
          '<button class="cancel" data-id="'+doc.id+'"><i class="fa-solid fa-trash"></i> إلغاء الحجز</button></div>';
      });
      box.innerHTML=html;
      box.querySelectorAll('.cancel').forEach(btn=>btn.onclick=async()=>{
        btn.disabled=true;btn.textContent='جاري الإلغاء…';
        try{await db.collection('bookings').doc(btn.dataset.id).delete();loadBookings();}
        catch(e){alert('مش قادرين نلغي الحجز دلوقتي، جرّب تاني.');}
      });
    }catch(e){box.innerHTML='<p class="muted">مش قادرين نجيب حجوزاتك حاليًا.</p>';}
  }

  $('bookForm').addEventListener('submit',async e=>{
    e.preventDefault();
    $('errBox').style.display='none';$('okBox').style.display='none';
    const doctor=$('doctor').value,date=$('date').value,time=$('time').value,notes=$('notes').value.trim();
    if(!date){$('errBox').textContent='⚠️ اختار تاريخ الحجز الأول.';$('errBox').style.display='block';return;}
    $('submitBtn').classList.add('loading');
    try{
      await db.collection('bookings').add({user_id:me.uid,student:me.name,email:me.email,doctor,date,time,notes,status:'pending',createdAt:new Date().toISOString()});
      $('okBox').textContent='✅ تم استلام حجزك بنجاح! حالته "قيد المراجعة" لحد ما الدكتور يأكيده.';
      $('okBox').style.display='block';
      $('bookForm').reset();
      loadBookings();
    }catch(err){
      $('errBox').textContent='⚠️ حصلت مشكلة: '+((err&&err.message)||err);
      $('errBox').style.display='block';
    }finally{$('submitBtn').classList.remove('loading');}
  });

  $('logoutBtn').onclick=async()=>{localStorage.removeItem('aea_user');await auth.signOut();location.href='index.html';};
</script>
</body>
</html>
